[package]
name = "loop-reference-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "software-change-provider"
path = "src/bin/software_change_provider.rs"

[[bin]]
name = "policy-document-provider"
path = "src/bin/policy_document_provider.rs"

[[bin]]
name = "research-provider"
path = "src/bin/research_provider.rs"

[dependencies]
loop-core = { path = "../../crates/loop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
