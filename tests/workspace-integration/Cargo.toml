[package]
name = "workspace-integration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

# The central target imports the former package integration roots with #[path]
# modules. cargo-machete cannot follow those module edges, so these test-only
# dependencies are retained and listed explicitly here.
[package.metadata.cargo-machete]
ignored = [
    "bookends-check",
    "libc",
    "loop-cli",
    "loop-core",
    "loop-integrations",
    "loop-reference-fixtures",
    "research-provider",
    "rusqlite",
    "software-change-provider",
    "tempfile",
]

[[test]]
name = "workspace"
path = "tests/workspace.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"
tempfile = "3.27"

[dev-dependencies]
bookends-check = { path = "../../crates/bookends-check" }
libc = "0.2"
loop-cli = { path = "../../crates/loop-cli" }
loop-core = { path = "../../crates/loop-core" }
loop-integrations = { path = "../../crates/loop-integrations" }
loop-reference-fixtures = { path = "../fixtures" }
research-provider = { path = "../../crates/research-provider" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
software-change-provider = { path = "../../crates/software-change-provider" }
