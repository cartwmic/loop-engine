[package]
name = "loop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "loop-engine"
path = "src/main.rs"

[dependencies]
loop-core = { path = "../loop-core" }
loop-integrations = { path = "../loop-integrations" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
