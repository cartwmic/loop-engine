[package]
name = "software-change-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[package.metadata.dist]
dist = true

[[bin]]
name = "software-change"
path = "src/main.rs"

[dependencies]
loop-core = { path = "../loop-core" }
bookends-check = { path = "../bookends-check" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
loop-integrations = { path = "../loop-integrations" }
sha2 = "0.10"
