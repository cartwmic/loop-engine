[package]
name = "lean-change-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
autotests = false

[package.metadata.dist]
dist = false

[lib]
name = "lean_change_provider"
path = "src/lib.rs"

[[bin]]
name = "lean-change"
path = "src/main.rs"

[dependencies]
loop-integrations = { path = "../loop-integrations" }
loop-core = { path = "../loop-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
