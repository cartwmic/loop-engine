[package]
name = "loop-engine-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
loop-engine-core = { version = "=0.1.0", path = "../loop-engine-core" }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
thiserror = "=2.0.18"
jiff = "=0.2.32"
uuid = { version = "=1.24.0", features = ["v7"] }
sha2 = "=0.11.0"
schemars = { version = "=1.2.1", features = ["derive", "jiff02", "uuid1"] }
tracing = "=0.1.44"
toml = "=1.1.3"

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
