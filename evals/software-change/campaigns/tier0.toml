# Tier 0: the cost-and-time floor. One whole-workflow trial for each of two models on one trivial case.
# The owner approves the case and the paid run; change the caps below before launch if you want different ones.
# Never run this without that approval. One command runs exactly this campaign and starts no other.
target = "scevals.target:create_target"
campaign = "tier-0"
tier = "tier-0"
report_note = "Tier 0 is a cost-and-time floor for two whole-workflow models on one trivial case, one trial each. It is not a ranking of the models."
cases_path = "evals/software-change/example-case"   # replace with the owner-approved tiny case before the paid run
case_count = 1
trials_per_case = 1
profile = "minimal-16"
models = ["codex/gpt-6.1-sol", "pi/claude-compat/claude-sonnet-5-5"]   # each model drives, implements and reviews its own trial
simulator_model = "codex/gpt-6.1-sol"
judge_model = "codex/gpt-6.1-sol"

# Budget: 30 minutes and 5 dollars for the whole command, from command start to report written.
campaign_wall_limit_seconds = 1800
campaign_budget_usd = 5.0
dollar_margin_usd = 1.0          # the dollar stop line is 4.0; the cap is best effort (about one call of overshoot is possible)
post_trial_reserve_seconds = 600 # trial work stops at 20 minutes; capture, scoring and the judge must finish by 28 minutes
publication_reserve_seconds = 120
idle_limit_seconds = 300
hard_limit_seconds = 720         # per-trial stop

[model_config."codex/gpt-6.1-sol"]
reasoning_effort = "high"

[model_config."pi/claude-compat/claude-sonnet-5-5"]
reasoning_effort = "high"

# Prices in dollars per million tokens, from Pi's model registry (@earendil-works/pi-ai dist/providers/data,
# checked 2026-10-17). Each request is priced by its own size: the base rates, or the tier rates when that
# request's total input is above the tier threshold. Where entries differ, the higher is used.
# gpt-6.1-sol: base 2/10 (cache read 0.1, write 2.5); a request above 272k input tokens costs 4/15 (cache read 0.2, write 5).
# claude-sonnet-5-5: 2/10, cache write 2.5; cache read is 0.1 in most entries and 0.2 in some -> 0.2.
[prices."codex/gpt-6.1-sol"]
input_per_million = 2
output_per_million = 10
cache_read_per_million = 0.1
cache_write_per_million = 2.5

[[prices."codex/gpt-6.1-sol".tiers]]
input_tokens_above = 272000
input_per_million = 4
output_per_million = 15
cache_read_per_million = 0.2
cache_write_per_million = 5

[prices."pi/claude-compat/claude-sonnet-5-5"]
input_per_million = 2
output_per_million = 10
cache_read_per_million = 0.2
cache_write_per_million = 2.5
