# Owner-chosen workflow model: Codex subscription, host-side Pi auth.
# GPT-6 Luna via OpenRouter remains pinned as simulator and judge.
target = "scevals.target:create_target"
campaign = "real-example"
cases_path = "evals/software-change/example-case"
case_count = 1
trials_per_case = 1
profile = "standard-14"
# A full standard-14 run took over 40 minutes with GPT-6.1 Sol.
time_limit_seconds = 7200
simulator_model = "openrouter/openai/gpt-6-luna"
judge_model = "openrouter/openai/gpt-6-luna"
models = ["codex/gpt-6.1-sol"]

# OpenRouter list prices on 2026-10-05 (USD per million tokens).
[prices."openrouter/openai/gpt-6-luna"]
input_per_million = 0.10
output_per_million = 0.50
cache_read_per_million = 0.01
cache_write_per_million = 0.125

# OpenAI rejects Inspect's default strict tool schemas for pi's optional tool
# parameters, so send tools non-strict.
[model_args."openrouter/openai/gpt-6-luna"]
strict_tools = false
