name: quality

on:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: publication / aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CI_EVENT_PATH: ${{ runner.temp }}/loop-engine-push-event.json
      ARTIFACT_ROOT: ${{ runner.temp }}/loop-engine-publication
      JUDGE_HOME: ${{ runner.temp }}/loop-engine-pi-agent
      MISE_AUTO_INSTALL: "false"
      MISE_AUTO_INSTALL_DISABLE_TOOLS: go

    steps:
      - name: Project exact CI push event
        id: event
        env:
          SOURCE_EVENT_PATH: ${{ github.event_path }}
          FALLBACK_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source = Path(os.environ["SOURCE_EVENT_PATH"]).read_bytes()
          destination = Path(os.environ["CI_EVENT_PATH"])
          content = False
          base = False
          checkout_revision = ""

          def closed_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON field: {key}")
                  result[key] = value
              return result

          def oid(value):
              return isinstance(value, str) and re.fullmatch(r"(?:[0-9a-f]{40}|[0-9a-f]{64})", value)

          def ref(value):
              if not isinstance(value, str) or not value.startswith("refs/"):
                  return False
              if value.endswith(("/", ".")) or ".." in value or "@{" in value or "//" in value:
                  return False
              for component in value.split("/"):
                  if (not component or component in {".", ".."} or component.startswith(".")
                          or component.endswith(".lock")):
                      return False
                  for character in component:
                      code = ord(character)
                      if code <= 32 or code == 127 or character in {"~", "^", ":", "?", "*", "[", "\\"}:
                          return False
              return True

          fallback = os.environ.get("FALLBACK_REVISION", "")
          if oid(fallback) and set(fallback) != {"0"}:
              checkout_revision = fallback

          try:
              event = json.loads(source.decode("utf-8"), object_pairs_hook=closed_object)
              before, after, reference = event["before"], event["after"], event["ref"]
              zero_pair = set(before) == {"0"} and set(after) == {"0"}
              if not (oid(before) and oid(after) and len(before) == len(after) and ref(reference)) or zero_pair:
                  raise ValueError("invalid push-event projection shape")
              projection = {"before": before, "after": after, "ref": reference}
              destination.write_text(
                  json.dumps(projection, ensure_ascii=False, separators=(",", ":")),
                  encoding="utf-8",
              )
              content = set(after) != {"0"}
              base = content and set(before) != {"0"}
              if content:
                  checkout_revision = after
          except (KeyError, TypeError, UnicodeError, ValueError, json.JSONDecodeError):
              destination.write_bytes(source)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"content={'true' if content else 'false'}\n")
              output.write(f"base={'true' if base else 'false'}\n")
              output.write(f"checkout_revision={checkout_revision}\n")
          PY

      - name: Import prior content revision
        if: steps.event.outputs.base == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.before }}
          persist-credentials: false

      - name: Checkout pushed repository
        if: steps.event.outputs.checkout_revision != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: false
          fetch-depth: 1
          ref: ${{ steps.event.outputs.checkout_revision }}
          persist-credentials: false

      - name: Checkout fallback repository
        if: steps.event.outputs.checkout_revision == ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          clean: false
          fetch-depth: 1
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install pinned cargo-deny
        if: steps.event.outputs.content == 'true'
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Install pinned mise
        if: steps.event.outputs.content == 'true'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          install: false

      - name: Install pinned Go
        if: steps.event.outputs.content == 'true'
        run: mise install go@1.26.5

      - name: Install Node.js for pi judge host
        if: steps.event.outputs.content == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install integrity-pinned pi coding agent
        if: steps.event.outputs.content == 'true'
        run: |
          set -euo pipefail
          PACKAGE_DIR="${RUNNER_TEMP}/pi-package"
          mkdir -p "${PACKAGE_DIR}"
          npm pack @mariozechner/pi-coding-agent@0.73.1 \
            --pack-destination "${PACKAGE_DIR}" \
            --json > "${PACKAGE_DIR}/pack.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          package_dir = Path(os.environ["RUNNER_TEMP"]) / "pi-package"
          record = json.loads((package_dir / "pack.json").read_text(encoding="utf-8"))[0]
          expected = "sha512-gXQh3SaZmWTfVMc4Ao5+LGbVeKvzyO7tolok0nLsZgq9nGjZx/EEU3NM8C+qUnB4Nvs2rswG5qOVgLzQkq0fHQ=="
          if record.get("integrity") != expected:
              raise SystemExit(f"pi package integrity mismatch: {record.get('integrity')}")
          (package_dir / "filename.txt").write_text(record["filename"], encoding="utf-8")
          PY
          npm install --global "${PACKAGE_DIR}/$(cat "${PACKAGE_DIR}/filename.txt")"

      - name: Provision semantic credentials outside repository
        if: steps.event.outputs.content == 'true'
        env:
          LOOP_ENGINE_SEMANTIC_JUDGE_PI_AUTH_JSON: ${{ secrets.LOOP_ENGINE_SEMANTIC_JUDGE_PI_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${LOOP_ENGINE_SEMANTIC_JUDGE_PI_AUTH_JSON:-}" ]; then
            echo "repository secret LOOP_ENGINE_SEMANTIC_JUDGE_PI_AUTH_JSON is required" >&2
            exit 1
          fi
          mkdir -p "${JUDGE_HOME}"
          python3 - <<'PY'
          import os
          from pathlib import Path

          auth = Path(os.environ["JUDGE_HOME"]) / "auth.json"
          auth.write_text(os.environ["LOOP_ENGINE_SEMANTIC_JUDGE_PI_AUTH_JSON"], encoding="utf-8")
          auth.chmod(0o600)
          PY

      - name: Run one aggregate publication lifecycle
        id: validate
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/loop-engine-pi-agent
          LOOP_ENGINE_SEMANTIC_JUDGE_PROVIDER: openai-codex
          LOOP_ENGINE_SEMANTIC_JUDGE_MODEL: gpt-5.6-sol
        run: |
          set -uo pipefail
          mkdir -p "${ARTIFACT_ROOT}"
          set +e
          cargo xtask validate --publication --ci-event "${CI_EVENT_PATH}" \
            >"${ARTIFACT_ROOT}/validation.stdout" \
            2>"${ARTIFACT_ROOT}/validation.stderr"
          status=$?
          set -e
          printf '%s\n' "${status}" > "${ARTIFACT_ROOT}/validation.status"
          printf 'status=%s\n' "${status}" >> "${GITHUB_OUTPUT}"

      - name: Upload publication evidence
        if: always() && steps.validate.outputs.status != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-${{ github.sha }}
          path: |
            ${{ runner.temp }}/loop-engine-publication
            ${{ github.workspace }}/.git/loop-engine/validation/v1/reports
            ${{ github.workspace }}/.git/loop-engine/validation/v1/attempts
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Return publication status
        if: always() && steps.validate.outputs.status != ''
        run: exit "${{ steps.validate.outputs.status }}"
