name: cargo-dist archive smoke

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist plan manifest supplied by the generated release workflow
        required: true
        type: string

jobs:
  archive-smoke:
    name: archive smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      DIST_PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install pinned Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - name: Assert the release plan matrix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DIST_PLAN" > "$RUNNER_TEMP/dist-plan.json"
          python3 scripts/assert-dist-plan.py "$RUNNER_TEMP/dist-plan.json"
      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - name: Extract and smoke all four applications
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          version="$(python3 -c 'import json,sys; v={r["app_version"] for r in json.load(open(sys.argv[1]))["releases"]}; assert len(v)==1; print(v.pop())' "$RUNNER_TEMP/dist-plan.json")"
          identity="$RUNNER_TEMP/package-identity-$target.json"
          args=()
          for app in loop-cli software-change-provider policy-document-provider research-provider; do
            archive="$GITHUB_WORKSPACE/target/distrib/${app}-${target}.tar.xz"
            checksum="$(awk '{print $1}' "$archive.sha256")"
            args+=(--archive "$app=$archive" --checksum "$app=$checksum")
          done
          python3 - "$identity" "$version" "$target" "$GITHUB_WORKSPACE/target/distrib" <<'PYIDENTITY'
          import json, pathlib, sys
          output, version, target, root = sys.argv[1:]
          apps = ('loop-cli', 'software-change-provider', 'policy-document-provider', 'research-provider')
          hashes = {app: (pathlib.Path(root) / f'{app}-{target}.tar.xz.sha256').read_text().split()[0] for app in apps}
          pathlib.Path(output).write_text(json.dumps(dict(version=version, platform=target, sha256=hashes)))
          PYIDENTITY
          python3 "$GITHUB_WORKSPACE/scripts/packaged-smoke.py" \
            --mode archive --expected-version "$version" --platform "$target" \
            --output-root "$RUNNER_TEMP/packaged-smoke-$target" \
            --package-identity "$identity" "${args[@]}"
      - name: Preserve packaged smoke captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-smoke-${{ matrix.target }}
          path: ${{ runner.temp }}/packaged-smoke-${{ matrix.target }}/
