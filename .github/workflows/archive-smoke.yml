name: cargo-dist archive smoke

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist plan manifest supplied by the generated release workflow
        required: true
        type: string

jobs:
  archive-smoke:
    name: archive smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      DIST_PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Assert the release plan matrix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$DIST_PLAN" > "$RUNNER_TEMP/dist-plan.json"
          python3 scripts/assert-dist-plan.py "$RUNNER_TEMP/dist-plan.json"
      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - name: Extract and smoke all four applications
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          extract="$RUNNER_TEMP/extracted-$target"
          software_data_root="$RUNNER_TEMP/software-change-data-$target"
          software_work_root="$RUNNER_TEMP/software-change-work-$target"
          policy_data_root="$RUNNER_TEMP/policy-document-data-$target"
          research_data_root="$RUNNER_TEMP/research-data-$target"
          smoke_cwd="$RUNNER_TEMP/packaged-smoke-cwd-$target"
          checkout_root="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          rm -rf \
            "$extract" "$software_data_root" "$software_work_root" \
            "$policy_data_root" "$research_data_root" "$smoke_cwd"
          mkdir -p "$extract" "$software_work_root" "$research_data_root" "$smoke_cwd"

          for app in loop-cli software-change-provider policy-document-provider research-provider; do
            archive="target/distrib/${app}-${target}.tar.xz"
            test -f "$archive"
            tar -xJf "$archive" -C "$extract"
          done

          engine="$(find "$extract" -type f -name loop-engine -perm -u+x -print -quit)"
          software_provider="$(find "$extract" -type f -name software-change -perm -u+x -print -quit)"
          policy_provider="$(find "$extract" -type f -name policy-document -perm -u+x -print -quit)"
          research_provider="$(find "$extract" -type f -name research -perm -u+x -print -quit)"
          test -n "$engine"
          test -n "$software_provider"
          test -n "$policy_provider"
          test -n "$research_provider"

          # Packaged proof must not inherit checkout-relative provider data or cwd.
          cd "$smoke_cwd"
          test "$(pwd -P)" != "$checkout_root"
          test -z "$(ls -A "$smoke_cwd")"
          printf 'packaged smoke cwd outside checkout: %s (checkout: %s)\n' \
            "$(pwd -P)" "$checkout_root"
          python3 "$GITHUB_WORKSPACE/scripts/production-journey.py" \
            --mode packaged \
            --engine "$engine" \
            --provider "$software_provider" \
            --data-root "$software_data_root" \
            --work-root "$software_work_root" \
            --profile high-rigor.json \
            --traversal-depth checked-prefix

          "$policy_provider" data-dump "$policy_data_root"
          policy_profile="$policy_data_root/crates/policy-document-provider/data/readme.json"
          test -f "$policy_profile"
          for mode in draft audit; do
            python3 "$GITHUB_WORKSPACE/scripts/policy-document-journey.py" \
              --engine "$engine" \
              --provider "$policy_provider" \
              --profile "$policy_profile" \
              --mode "$mode"
          done

          python3 "$GITHUB_WORKSPACE/scripts/research-journey.py" \
            --mode packaged \
            --engine "$engine" \
            --provider "$research_provider" \
            --data-root "$research_data_root" \
            --profile standard.json
