name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run is a full-suite run of the dispatched head. On a branch the
  # red-main merge gate (`ci-main-status --merge-gate --pr N`) accepts it as the
  # proof that a fix PR passes the whole suite, which a pull_request run never
  # is. On main it re-checks main's tip commit.
  workflow_dispatch:

permissions:
  contents: read

# A PR runs `checks` only, which includes the Bookends gate on the PR's own
# range. A newer push to the PR cancels its superseded run.
# A push to main, or a manual run (workflow_dispatch), runs
# `checks`, `tests` and `release-tests`. Each push has its own group (its tip
# SHA), each manual run its own (its run id), and neither is cancelled: release
# requires a successful push run for the exact commit, and the Bookends range
# of a cancelled push would otherwise go unchecked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          # PRs check the PR head, not the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The PR Bookends gate below walks the history from the merge base.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      # Keep the check list in sync with scripts/baseline.sh.
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build workspace
        run: cargo build --workspace --locked
      # The push gate in `tests` never runs on a PR, so a requirement edit that
      # breaks Bookends' identity check would only turn main red after merge.
      # This runs the same gate on the commits the PR adds on top of main, from
      # the merge base to the PR head. The workspace build above already built
      # `bookends-check`, so this costs no extra compile.
      - name: Bookends PR-range gate
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          AFTER="$PR_HEAD"
          BEFORE="$(git merge-base "$PR_BASE" "$PR_HEAD")"
          # Fail closed: an empty range would print GREEN without checking anything.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$AFTER" ]; then
            echo "$AFTER adds nothing on top of the PR base $PR_BASE, so there is no range to check." >&2
            exit 1
          fi
          BIN_DIR="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"] + "/debug")')"
          export PATH="$BIN_DIR:$PATH"
          unset BOOKENDS_BYPASS
          export BOOKENDS_UPDATE_STREAM=1 BOOKENDS_REMOTE=origin
          printf 'refs/heads/main %s refs/heads/main %s\n' "$AFTER" "$BEFORE" | scripts/bookends-check-gate.sh

  # Push to main or a manual run: the workspace tests, the journey self-tests
  # and the Bookends range gate, on the pushed or dispatched commit.
  tests:
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - uses: Swatinem/rust-cache@v2
      - name: Use runner-owned test temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      # These literal collection commands establish Bookends eligibility.
      - name: Workspace tests
        run: cargo test --workspace
      - name: External-work journey self-test
        run: python3 scripts/external-work-journey.py
      - name: Policy-document journey self-test
        run: python3 scripts/policy-document-journey.py
      - name: Research journey self-test
        run: python3 scripts/research-journey.py
      - name: Lean-change journey self-test
        run: python3 scripts/lean-change-journey.py
      - name: Lean-change mutation applicability
        run: python3 scripts/lean-change-mutations.py
      - name: Generate-PRD journey self-test
        run: python3 scripts/generate-prd-journey.py
      - name: PRD prose check tests
        run: python3 scripts/test_prd_prose_check.py
      - name: Triage skill copies tests
        run: python3 scripts/test_triage_skills.py
      # A push checks the pushed range. A manual run on a branch checks the
      # commits the branch adds on top of main: from the merge base to the
      # dispatched tip. A manual run on main checks main's tip commit (main is
      # squash-merged: one commit per push), from its first parent.
      - name: Bookends pushed-range gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_AFTER: ${{ github.event.after }}
          PUSH_BEFORE: ${{ github.event.before }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = push ]; then
            AFTER="$PUSH_AFTER"
            BEFORE="$PUSH_BEFORE"
          elif [ "$DISPATCH_REF" = refs/heads/main ]; then
            AFTER="$DISPATCH_SHA"
            BEFORE="$(git rev-parse --verify --quiet "$AFTER^1" || true)"
          else
            AFTER="$DISPATCH_SHA"
            BEFORE="$(git merge-base origin/main "$DISPATCH_SHA")"
          fi
          # Fail closed: an empty range would print GREEN without checking
          # anything. A branch with nothing past main, or a root commit, has none.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "$AFTER" ]; then
            echo "$AFTER has no commits to check ($BEFORE..$AFTER is empty). A manual run on a branch needs commits past origin/main; on main it needs a parent commit." >&2
            exit 1
          fi
          BIN_DIR="$(cargo metadata --format-version 1 --no-deps | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"] + "/debug")')"
          export PATH="$BIN_DIR:$PATH"
          unset BOOKENDS_BYPASS
          export BOOKENDS_UPDATE_STREAM=1 BOOKENDS_REMOTE=origin
          printf 'refs/heads/main %s refs/heads/main %s\n' "$AFTER" "$BEFORE" | scripts/bookends-check-gate.sh

  # Push to main or a manual run. release-after-merge.sh reads the push run's
  # conclusion, not its job names, so a green push run still satisfies it.
  release-tests:
    runs-on: ubuntu-22.04
    if: github.event_name != 'pull_request'
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - name: Use runner-owned test temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Release-after-merge script tests (8 shards)
        run: python3 scripts/run-release-tests-sharded.py
