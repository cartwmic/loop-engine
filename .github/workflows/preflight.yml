name: production preflight

on:
  workflow_call:
    inputs:
      plan:
        description: cargo-dist plan manifest supplied by generated release workflow
        required: true
        type: string

jobs:
  baseline-and-source-journey:
    name: baseline and full source journey
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Record preflight start
        shell: bash
        run: |
          set -euo pipefail
          printf 'PREFLIGHT_STARTED_AT=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Install dist
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
      - name: Install operator-provided dagu
        shell: bash
        run: |
          set -euo pipefail
          version=2.14.0
          url="https://github.com/dagu-org/dagu/releases/download/v${version}/dagu_${version}_linux_amd64.tar.gz"
          bin="$RUNNER_TEMP/dagu-bin"
          mkdir -p "$bin"
          curl -fsSL "$url" | tar -xz -C "$bin" dagu
          chmod +x "$bin/dagu"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/dagu" version
      # sccache's GHA backend uses the runner-provided cache service; it does
      # not require a repository secret or an object-store credential.
      - name: Install pinned sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.17.0"
      # sccache 0.17's GHA backend reads the runner-provided cache service
      # variables from the job environment. Export them for later steps as
      # prescribed by the sccache GHA documentation; they are ephemeral
      # runner credentials, not repository secrets.
      - name: Export GitHub Actions cache runtime variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Start credential-free sccache GHA backend
        shell: bash
        env:
          SCCACHE_GHA_ENABLED: "true"
          SCCACHE_GHA_VERSION: "loop-engine-preflight-v1"
          SCCACHE_GHA_RW_MODE: "READ_WRITE"
          SCCACHE_IDLE_TIMEOUT: "0"
          RUSTC_WRAPPER: "sccache"
        run: |
          set -euo pipefail
          test -n "${SCCACHE_PATH:-}"
          test "$("$SCCACHE_PATH" --version)" = "sccache 0.17.0"
          printf 'SCCACHE_GHA_ENABLED=%s\n' "$SCCACHE_GHA_ENABLED" >> "$GITHUB_ENV"
          printf 'SCCACHE_GHA_VERSION=%s\n' "$SCCACHE_GHA_VERSION" >> "$GITHUB_ENV"
          printf 'SCCACHE_GHA_RW_MODE=%s\n' "$SCCACHE_GHA_RW_MODE" >> "$GITHUB_ENV"
          printf 'SCCACHE_IDLE_TIMEOUT=%s\n' "$SCCACHE_IDLE_TIMEOUT" >> "$GITHUB_ENV"
          printf 'RUSTC_WRAPPER=%s\n' "$RUSTC_WRAPPER" >> "$GITHUB_ENV"
          "$SCCACHE_PATH" --stop-server || true
          "$SCCACHE_PATH" --start-server
          "$SCCACHE_PATH" --zero-stats
          "$SCCACHE_PATH" --show-stats --stats-format=json
      - name: Install pinned cargo-nextest
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-nextest --version 0.9.143 --locked
          test "$(cargo nextest --version | sed -n '1s/^cargo-nextest //p')" = "0.9.143"
      - name: Install pinned cargo-machete
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-machete --version 0.9.2 --locked
          test "$(cargo machete --version)" = "0.9.2"
      - name: Validate repository test tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/assert-nextest.py --self-test
          python3 scripts/assert-nextest.py
          python3 scripts/assert-test-topology.py --self-test
          python3 scripts/assert-test-inventory.py --self-test
          python3 scripts/sccache-proof.py --self-test
          python3 scripts/assert-push-main-preflight.py --self-test
      - name: Run dependency audit
        run: python3 scripts/dependency-audit.py
      - name: Check generated release workflow
        run: dist generate --check
      - name: Assert release plan matrix
        shell: bash
        env:
          DIST_PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          printf '%s' "$DIST_PLAN" > "$RUNNER_TEMP/dist-plan.json"
          python3 scripts/assert-dist-plan.py --self-test
          python3 scripts/assert-dist-plan.py "$RUNNER_TEMP/dist-plan.json"
          python3 scripts/assert-release-gates.py
          python3 scripts/assert-push-main-preflight.py
      - name: Run Bookends check
        env:
          BOOKENDS_BYPASS: ""
        run: scripts/bookends-check-gate.sh
      - name: Run ordinary nextest and doctest path
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-nextest.py
      - name: Prove bounded nextest timeout cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prove-nextest-timeout.py \
            --report "$RUNNER_TEMP/nextest-timeout-proof.json"
      - name: Build central target for structure and inventory assertions
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/central-test-artifacts.jsonl" \
            "$RUNNER_TEMP/stock-cargo-handoff.json"
          python3 scripts/run-central-tests.py \
            --no-run \
            --compiler-artifacts "$RUNNER_TEMP/central-test-artifacts.jsonl" \
            --handoff-output "$RUNNER_TEMP/stock-cargo-handoff.json"
      - name: Assert one integration target and current test inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/assert-test-topology.py \
            --repo "$GITHUB_WORKSPACE" \
            --compiler-artifacts "$RUNNER_TEMP/central-test-artifacts.jsonl"
          python3 scripts/assert-test-inventory.py \
            --repo "$GITHUB_WORKSPACE" \
            --compiler-artifacts "$RUNNER_TEMP/central-test-artifacts.jsonl" \
            --current-only
      - name: Run stock Cargo compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/stock-cargo-handoff.json"
          LOOP_ENGINE_TEST_BINARY_HANDOFF="$RUNNER_TEMP/stock-cargo-handoff.json" \
            cargo test --workspace
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build journey binaries
        run: cargo build --locked -p loop-cli -p software-change-provider -p policy-document-provider -p research-provider -p bookends-check
      # These exact no-argument harness invocations are the Bookends discovery
      # surface. The checker accepts only one-file command forms for default-CI
      # eligibility; the parameterized journeys below provide the end-to-end proof.
      - name: Collect software-change public journey surface for Bookends
        run: python3 scripts/software-change-journey.py
      - name: Collect policy-document public journey surface for Bookends
        run: python3 scripts/policy-document-journey.py
      - name: Collect research public journey surface for Bookends
        run: python3 scripts/research-journey.py
      - name: Collect Generate-PRD public journey surface for Bookends
        run: python3 scripts/generate-prd-journey.py
      - name: Assert Generate-PRD profile
        run: python3 scripts/assert-generate-prd-profile.py
      - name: Run journey interface negative self-test
        run: python3 scripts/software-change-journey.py --self-test
      - name: Run research journey interface negative self-test
        run: python3 scripts/research-journey.py --self-test
      - name: Run Generate-PRD journey self-test
        run: python3 scripts/generate-prd-journey.py --self-test
      - name: Run full software-change source journey
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/software-change-journey-work"
          python3 scripts/software-change-journey.py \
            --mode source \
            --engine target/debug/loop-engine \
            --provider target/debug/software-change \
            --data-root "$GITHUB_WORKSPACE" \
            --work-root "$RUNNER_TEMP/software-change-journey-work" \
            --profile crates/software-change-provider/data/configs/high-rigor.json \
            --traversal-depth full
      - name: Run policy-document source journeys
        shell: bash
        run: |
          set -euo pipefail
          for mode in draft audit; do
            python3 scripts/policy-document-journey.py \
              --engine target/debug/loop-engine \
              --provider target/debug/policy-document \
              --profile crates/policy-document-provider/data/readme.json \
              --mode "$mode"
          done
      - name: Run research source journey
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/research-journey.py \
            --mode source \
            --engine target/debug/loop-engine \
            --provider target/debug/research \
            --profile crates/research-provider/data/configs/standard.json
      - name: Run Generate-PRD source journey
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/generate-prd-journey-work"
          python3 scripts/generate-prd-journey.py \
            --mode source \
            --engine target/debug/loop-engine \
            --provider target/debug/research \
            --checker target/debug/bookends-check \
            --work-root "$RUNNER_TEMP/generate-prd-journey-work" \
            --profile crates/research-provider/data/configs/generate-prd.json
      - name: Emit hosted sccache statistics and total preflight wall time
        shell: bash
        run: |
          set -euo pipefail
          started="${PREFLIGHT_STARTED_AT:?}"
          finished="$(date +%s)"
          elapsed=$((finished - started))
          test "$elapsed" -ge 0
          printf 'preflight_total_wall_seconds=%s\n' "$elapsed" | tee \
            "$RUNNER_TEMP/preflight-total-wall-time.txt"
          test -s "$RUNNER_TEMP/preflight-total-wall-time.txt"
          "$SCCACHE_PATH" --show-stats
          "$SCCACHE_PATH" --show-stats --stats-format=json | tee \
            "$RUNNER_TEMP/sccache-final-stats.json"
          test -s "$RUNNER_TEMP/sccache-final-stats.json"
