[workspace]
members = [
    "crates/loop-engine-core",
    "crates/loop-engine-integrations",
    "crates/loop-engine-cli",
]
resolver = "3"
exclude = ["test-support/providers/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
