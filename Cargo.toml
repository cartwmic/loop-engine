[workspace]
members = [
    "crates/loop-core",
    "crates/loop-integrations",
    "crates/loop-cli",
    "crates/software-change-provider",
    "crates/policy-document-provider",
    "tests/fixtures",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/cartwmic/loop-engine"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
installers = ["shell"]
# Keep cargo-dist's automatic package README and license inclusion enabled.
auto-includes = true
checksum = "sha256"
dispatch-releases = true
pr-run-mode = "upload"
# cargo-dist 0.32 global-artifact hooks run after local matrix builds and are
# direct host dependencies; keeping both proof workflows here makes failures
# publication-blocking without editing generated release.yml.
global-artifacts-jobs = ["./preflight", "./archive-smoke"]

[profile.dist]
inherits = "release"
lto = "thin"
