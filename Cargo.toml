[workspace]
members = [
    "crates/loop-core",
    "crates/loop-integrations",
    "crates/loop-cli",
    "crates/software-change-provider",
    "tests/fixtures",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/cartwmic/loop-engine"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
installers = ["shell"]
# Keep cargo-dist's automatic package README and license inclusion enabled.
auto-includes = true
checksum = "sha256"

[profile.dist]
inherits = "release"
lto = "thin"
