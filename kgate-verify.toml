# kgate profile for `lean-change verify --runner kgate --kgate-profile kgate-verify.toml`: one crate's tests, not the baseline.
# The baseline profile (kgate.toml) asks for 12 CPUs; on 2026-11-13 no node had room for that for 10 minutes (kgate exit 75).
# Same image and tools as kgate.toml. cpu 4 is what `cargo test -p lean-change-provider` was run with on the cluster that day.
image  = "ghcr.io/cartwmic/kgate@sha256:9d1f630847066b1608cb18783ff03403734dd8442624f1055849bdf345ffeb38"
cpu    = 4
memory = "5632Mi"
memory_limit = "8Gi"
# ephemeral_storage is the disk request (kgate default 3Gi): the kgate lead measured the Rust gate peaking at 5.6 GiB of disk (2026-11-16), so 8Gi keeps the pod from eviction.
ephemeral_storage = "8Gi"

[tools]
rustc   = "1.98.0"
cargo   = "1.98.0"
python3 = "3.14.6"
