schema_version = 2

[defaults]
timeout_seconds = 900
max_output_bytes = 8388608

[defaults.environment]
unset = ["RUSTUP_TOOLCHAIN"]

[defaults.environment.set]
CARGO_TARGET_DIR = "{target_root}"
GOCACHE = "{cache_root}"
MISE_AUTO_INSTALL = "false"
MISE_AUTO_INSTALL_DISABLE_TOOLS = "go"
TMPDIR = "{scratch_root}"

[runner]
inputs = [
  ".cargo",
  ".githooks",
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "rustfmt.toml",
  "deny.toml",
  "xtask",
  "quality",
]

[[prerequisites]]
id = "cargo-deny"
program = "cargo"
args = ["deny", "--version"]
stdout_equals = "cargo-deny 0.20.2"
install_hint = "cargo install cargo-deny --locked --version 0.20.2"

[[prerequisites]]
id = "go-1.26.5"
program = "mise"
args = ["where", "go@1.26.5"]
install_hint = "mise install go@1.26.5"

[[checks]]
id = "diff-check"
phases = ["pre-commit", "publication"]
scope = "changed-files"
program = "/usr/bin/git"
args = ["--git-dir={git_directory}", "diff", "--check", "{base_revision}", "{candidate_revision}", "--"]
cwd = "{candidate_root}"

[[checks]]
id = "fmt"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "cargo"
args = ["fmt", "--all", "--check"]
cwd = "{candidate_root}"

[[checks]]
id = "check"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "cargo"
args = ["check", "--workspace", "--locked"]
cwd = "{candidate_root}"

[[checks]]
id = "clippy"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
cwd = "{candidate_root}"

[[checks]]
id = "test"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "cargo"
args = ["test", "--workspace", "--locked"]
cwd = "{candidate_root}"

[[checks]]
id = "doc"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "cargo"
args = ["doc", "--workspace", "--no-deps", "--locked"]
cwd = "{candidate_root}"

[[checks]]
id = "reference-provider-test"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "cargo"
args = ["test", "--manifest-path", "test-support/providers/reference-provider/Cargo.toml", "--locked"]
cwd = "{candidate_root}"

[[checks]]
id = "scenario-provider-test"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "cargo"
args = ["test", "--manifest-path", "test-support/providers/scenario-provider/Cargo.toml", "--locked"]
cwd = "{candidate_root}"

[[checks]]
id = "reference-go-test"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "mise"
args = ["exec", "go@1.26.5", "--", "go", "test", "./..."]
cwd = "{candidate_root}/examples/providers/reference-go"

[[checks]]
id = "deny"
phases = ["pre-commit", "publication"]
scope = "repository"
program = "cargo"
args = ["deny", "check"]
cwd = "{candidate_root}"

[semantic]
program = "{candidate_root}/quality/semantic-judge/v2/judge"
args = []
cwd = "{candidate_root}"
timeout_seconds = 900
max_output_bytes = 8388608
response_schema = "quality/semantic-judge/v2/response.schema.json"

[semantic.environment]
unset = []

[semantic.environment.set]
TMPDIR = "{scratch_root}"

[[semantic.axes]]
id = "documentation"
rubric = "quality/rubrics/documentation.md"

[[semantic.axes]]
id = "observability"
rubric = "quality/rubrics/observability.md"

[[semantic.axes]]
id = "architecture"
rubric = "quality/rubrics/architecture.md"

[[semantic.axes]]
id = "behavioral-evidence"
rubric = "quality/rubrics/behavioral-evidence.md"

[semantic.coherence]
id = "coherence"
rubric = "quality/rubrics/coherence.md"
